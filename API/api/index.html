<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product API Test</title>
</head>

<body>
<h2>เพิ่มสินค้า</h2>

<input type="text" id="name" placeholder="ชื่อสินค้า">
<input type="number" id="price" placeholder="ราคา">
<button onclick="addProduct()">เพิ่มสินค้า</button>

<script>
function addProduct() {
  fetch("https://hosting.udru.ac.th/~it67040233114/API/api/products.php", {
    method: "POST",
    headers: {
      "Content-Type": "application/json; charset=UTF-8"
    },
    body: JSON.stringify({
      product_name: document.getElementById("name").value,
      price: document.getElementById("price").value
    })
  })
  .then(res => res.json())
  .then(data => console.log(data))
  .catch(err => console.error(err));
}
</script>

</body>
</html>
